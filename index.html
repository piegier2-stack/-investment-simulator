<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f7f5" />
    <title>積立元本かんたん計算</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="page">
      <section class="card" aria-labelledby="page-title">
        <header class="intro">
          <p class="eyebrow">つみたてシミュレーター</p>
          <h1 id="page-title">積立元本を<br />かんたん計算</h1>
          <p class="description">毎月の積立額と期間を入力すると、積み立てる元本の合計がわかります。</p>
        </header>

        <form id="calculator" novalidate>
          <div class="field">
            <label for="monthly-amount">毎月の積立額</label>
            <div class="input-wrap">
              <input
                id="monthly-amount"
                name="monthlyAmount"
                type="text"
                inputmode="numeric"
                autocomplete="off"
                enterkeyhint="next"
                placeholder="例：30,000"
                aria-describedby="monthly-error"
              />
              <span class="unit">円</span>
            </div>
            <p id="monthly-error" class="error" aria-live="polite"></p>
          </div>

          <div class="field">
            <label for="years">積立年数</label>
            <div class="input-wrap">
              <input
                id="years"
                name="years"
                type="text"
                inputmode="numeric"
                autocomplete="off"
                enterkeyhint="done"
                placeholder="例：20"
                aria-describedby="years-error"
              />
              <span class="unit">年</span>
            </div>
            <p id="years-error" class="error" aria-live="polite"></p>
          </div>

          <button type="submit">計算する</button>
        </form>

        <section id="result" class="result" aria-live="polite" aria-atomic="true" hidden>
          <p>積立元本</p>
          <output id="principal">0円</output>
          <p id="calculation" class="calculation"></p>
        </section>

        <p class="note">※ 利息や運用益は含まない、積立額の合計です。</p>
      </section>
    </main>
  </body>
</html>
